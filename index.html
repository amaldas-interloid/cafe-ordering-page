<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter2 Kaapi</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark">☕</span>

        <div>
          <h1>Filter Kaapi</h1>
          <p>Tiffin and coffee, served since 1962</p>
        </div>
      </div>
    </header>

    <main class="main-layout">
      <section class="menu">
        <div class="menu-head">
          <h2>Today's menu</h2>
        </div>

        <div class="menu-grid" id="menu-grid"></div>
      </section>

      <aside class="cart">
        <h2 id="cart-title">Your order (0)</h2>

        <ul class="cart-list" id="cart-list"></ul>

        <p class="cart-empty" id="cart-empty">
          Your plate is empty. Add a dish from the menu.
        </p>

        <dl class="bill">
          <div class="total">
            <dt>Total</dt>
            <dd id="total">₹0</dd>
          </div>
        </dl>
      </aside>
    </main>
  </body>
</html>
